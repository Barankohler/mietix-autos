<!doctype html>
<html lang="de"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Autos">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Mietix Autos</title>
<style>
input,select,textarea{font-size:16px;font-family:inherit;max-width:100%;box-sizing:border-box}input[type=date],input[type=time],input[type=datetime-local]{-webkit-appearance:none;appearance:none;min-width:0;max-width:100%;min-height:44px}select{min-width:0}

:root{--rot:#C4161C;--text:#2E2E30;--rand:#E4E4E7;--grau:#6F6F72;--bg:#F6F6F7;--gruen:#1B8A4B;--hell:#FDECEC;--gelb:#FFF4D6}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);padding-bottom:40px;-webkit-text-size-adjust:100%}
header{background:#fff;border-bottom:3px solid var(--rot);padding:calc(12px + env(safe-area-inset-top)) 18px 12px;position:sticky;top:0;z-index:5}
header h1{font-size:16px;letter-spacing:1px;font-weight:800}header h1 span{color:var(--rot)}
.reiter{display:flex;gap:8px;margin-top:10px}
.reiter div{flex:1;text-align:center;padding:10px;border-radius:12px;background:var(--bg);font-weight:800;font-size:14px;color:var(--grau);cursor:pointer}
.reiter div.an{background:var(--rot);color:#fff}
main{max-width:680px;margin:0 auto;padding:16px}
.karte{background:#fff;border-radius:18px;padding:16px;margin-bottom:14px;border:1px solid var(--rand)}
.karte h2{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--rot);margin-bottom:8px}
.auto h3{font-size:18px;font-weight:900}
.auto .kz{font-size:13px;color:var(--grau);font-weight:700;margin-bottom:8px}
.zeile{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--rand);font-size:14px}
.fs{align-items:center}.fs i{display:block;font-style:normal;font-size:12px;color:#6F6F72}.fsKn{display:flex;gap:6px}
.fsKn button,.fsKn label{border:1.5px solid var(--rand);background:#fff;border-radius:999px;padding:7px 12px;font:700 13px inherit;cursor:pointer}
.fsKn button{background:#C4161C;border-color:#C4161C;color:#fff}.fsKn button[disabled]{opacity:.4}
.zeile:last-child{border-bottom:0}.zeile b{font-weight:800}
.rot{color:var(--rot)}.gruen{color:var(--gruen)}.grau{color:var(--grau)}
.punkt{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--rand);cursor:pointer}
.punkt:last-child{border-bottom:0}
.punkt .box{width:24px;height:24px;border:2px solid var(--rand);border-radius:7px;flex:0 0 24px}
.punkt .t{font-size:15px;font-weight:700}.punkt i{display:block;font-style:normal;font-size:12px;color:var(--grau);font-weight:600}
.punkt.heute .t{color:var(--rot)}
.punkt.frag .box{border-color:var(--rot);background:#FDECEC}.punkt.frag i{color:var(--rot)}
.punkt .box.an{background:var(--rot);border-color:var(--rot)}.punkt.alt .t{color:var(--grau);text-decoration:line-through}
.erl a{display:block;font-size:13px;color:var(--grau);font-weight:700;padding:8px 0;text-decoration:none}
.neu{display:flex;gap:8px;margin-top:10px}
.neu input,.neu select{min-width:0;width:0}
.neu input{flex:1;border:1px solid var(--rand);border-radius:12px;padding:11px 12px;font-weight:600;font-size:16px;font-family:inherit;min-height:46px}
.neu button{background:var(--rot);color:#fff;border:0;border-radius:12px;padding:0 16px;font-weight:800;font-size:16px;font-family:inherit;cursor:pointer}
.leer{color:var(--grau);text-align:center;padding:12px;font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{padding:8px 11px;border-radius:999px;border:1px solid var(--rand);background:#fff;font-weight:700;font-size:13px;cursor:pointer}
.chip.an{background:var(--rot);border-color:var(--rot);color:#fff}
.versteckt{display:none!important}
.meldung{position:fixed;left:16px;right:16px;bottom:24px;background:var(--gruen);color:#fff;border-radius:14px;padding:14px;font-weight:800;text-align:center;z-index:9;display:none}

.mxKnopf,.mxKlapp>summary{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;box-sizing:border-box;background:#fff;border:1.5px solid #E4E4E7;border-radius:16px;padding:14px 16px;min-height:60px;text-align:left;font-family:inherit;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.04);color:#1C1C1E;margin:0 0 10px;-webkit-tap-highlight-color:transparent}
.mxKnopf span,.mxKlapp>summary span{flex:1;min-width:0}
.mxKnopf b,.mxKlapp>summary b{display:block;font-size:16px;font-weight:800;color:#1C1C1E}
.mxKnopf i,.mxKlapp>summary i{display:block;font-style:normal;font-size:13px;color:#8A8A8E;margin-top:2px;font-weight:600}
.mxKnopf em,.mxKlapp>summary em{flex:0 0 auto;font-style:normal;font-size:28px;color:#C4161C;font-weight:700;line-height:1;transition:transform .15s}
.mxKnopf:active,.mxKlapp>summary:active{background:#F6F6F7}
.mxKlapp>summary{list-style:none}.mxKlapp>summary::-webkit-details-marker{display:none}
.mxKlapp[open]>summary{margin-bottom:10px}.mxKlapp[open]>summary em{transform:rotate(90deg)}
.mxBg{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:90;display:none}.mxBg.auf{display:block}
.mxFenster{position:fixed;left:0;right:0;bottom:0;z-index:91;background:#fff;border-radius:22px 22px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;display:none;box-shadow:0 -10px 30px rgba(0,0,0,.18);margin:0 auto;max-width:560px;box-sizing:border-box;text-align:left}
.mxFenster.auf{display:block;animation:mxHoch .22s ease-out}.mxBg.auf{animation:mxBlende .2s ease-out}
@keyframes mxHoch{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}@keyframes mxBlende{from{opacity:0}to{opacity:1}}
@media(min-width:700px){.mxFenster{top:50%;bottom:auto;transform:translateY(-50%);border-radius:22px;width:calc(100% - 48px);padding:20px}.mxFenster.auf{animation:mxMitte .2s ease-out}}
@keyframes mxMitte{from{transform:translateY(-46%);opacity:0}to{transform:translateY(-50%);opacity:1}}
.mxKopf{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:10px}
.mxKopf h3{font-size:19px;font-weight:900;margin:0;color:#1C1C1E}
.mxZu{flex:0 0 auto;width:40px;height:40px;border-radius:50%;border:0;background:#F2F2F4;font-size:17px;font-weight:800;cursor:pointer;color:#1C1C1E;font-family:inherit}
.mxKlein{margin-top:8px}.mxKlein>summary{display:inline-flex;align-items:center;gap:6px;list-style:none;cursor:pointer;font-size:14px;font-weight:800;color:#1C1C1E;background:#F2F2F4;border-radius:999px;padding:9px 14px;min-height:40px;box-sizing:border-box}
.mxKlein>summary::-webkit-details-marker{display:none}.mxKlein>summary em{font-style:normal;color:#C4161C;font-size:18px;line-height:1;transition:transform .15s}.mxKlein[open]>summary em{transform:rotate(90deg)}
.mxText{font-size:14px;color:#8A8A8E;font-weight:600;margin:0 0 10px;line-height:1.4}
</style></head><body>
<header><h1>MIETIX <span>AUTOS</span> <i id="abgleichPunkt" title="Abgleich aller Geräte" style="display:inline-block;width:9px;height:9px;border-radius:50%;background:#B0B0B3;vertical-align:middle;margin-left:4px"></i></h1>
  <div class="reiter"><div data-s="autos" class="an">Autos</div><div data-s="aufgaben">Aufgaben</div></div></header>
<main>
<div id="abgleich"></div>
<section id="s_autos">
  <button class="mxKnopf" type="button" data-fenster="fWer"><span><b>Wer fuhr wann?</b><i>Bußgeld, Blitzer, Parkverstoß: Fahrer zu Datum und Auto</i></span><em>›</em></button>
  <div id="autos"></div></section>
<section id="s_aufgaben" class="versteckt">
  <div class="karte"><h2>Neue Aufgabe</h2>
    <div class="neu"><input id="neuAufgabe" placeholder="Was ist zu tun?"><button id="neuLos">+</button></div>
    <div class="chips" id="neuBis"><div class="chip" data-t="0">heute</div><div class="chip" data-t="1">morgen</div><div class="chip" data-t="7">in 1 Woche</div><div class="chip" data-t="">kein Datum</div></div>
    <div class="leer" style="padding:6px 0 0;text-align:left">Steht in 15 Minuten auch in der Excel (Reiter Aufgaben).</div></div>
  <div class="karte versteckt" id="termineKarte"><h2>Termine in den nächsten 30 Tagen</h2><div id="termine"></div></div>
  <div class="karte"><h2>Offene Aufgaben</h2><div id="aufgaben"></div></div>
</section>
</main>
<div class="mxFenster" id="fWer" role="dialog" aria-label="Wer fuhr wann?"><div class="mxKopf"><h3>Wer fuhr wann?</h3><button class="mxZu" type="button" aria-label="Schließen">✕</button></div><p class="mxText">Datum und Auto wählen, dann stehen die Fahrerdaten zum Kopieren da.</p><div id="wfInhalt">
    <div class="neu" style="margin-top:0"><input id="wfDatum" type="date" style="flex:1"><select id="wfAuto" style="flex:1.4;border:1px solid var(--rand);border-radius:12px;padding:11px;font-weight:600;font-size:16px;font-family:inherit;background:#fff;min-width:0"></select></div>
    <div id="wfErgebnis" class="leer" style="text-align:left">Datum und Auto wählen.</div></div></div>
<div class="meldung" id="meldung"></div>
<script>
const $=id=>document.getElementById(id);
const lies=(k,d)=>{try{return JSON.parse(localStorage.getItem(k)||"")||d}catch(e){return d}};
const schreib=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const pad=n=>String(n).padStart(2,"0");
const iso=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const de=s=>s?String(s).slice(0,10).split("-").reverse().join("."):"";
const zahl=v=>{if(v===null||v===undefined)return null;const s=String(v).trim();if(!s)return null;const n=parseFloat(s.indexOf(",")>=0?s.replace(/\./g,"").replace(",","."):s.replace(/\.(?=\d{3}(\D|$))/g,""));return isNaN(n)?null:n};
const km=n=>n?Math.round(n).toLocaleString("de-DE")+" km":"";
function meldung(t){const m=$("meldung");m.textContent=t;m.style.display="block";setTimeout(()=>m.style.display="none",2200)}
let D=null,SICHT="autos",NEU_BIS=null;
const heute=()=>iso(new Date());
const tageBis=s=>s?Math.round((new Date(s+"T12:00")-new Date(heute()+"T12:00"))/86400000):null;

/* ---------- Autos ---------- */
function termin(name,datum){const t=tageBis(datum);if(t===null)return'<div class="zeile"><span>'+name+'</span><span class="grau">kein Datum</span></div>';
  const k=t<0?"rot":t<=30?"rot":"";return'<div class="zeile"><span>'+name+'</span><b class="'+k+'">'+de(datum)+(t<0?" (überfällig)":t<=30?" (in "+t+" Tagen)":"")+'</b></div>'}
// Garantie: „bis TT.MM.JJJJ, über X“, ab 30 Tagen vor Ablauf rot (Brücke liefert garantie als ISO-Datum, garantieUeber als Text)
function garantieZeile(a){const t=tageBis(a.garantie),ue=a.garantieUeber?", über "+a.garantieUeber:"";
  if(t===null)return'<div class="zeile"><span>Garantie</span><span class="grau">'+(ue?"Datum fehlt"+ue:"nicht eingetragen")+'</span></div>';
  const k=t<=30?"rot":"";return'<div class="zeile"><span>Garantie</span><b class="'+k+'">'+(t<0?"abgelaufen am "+de(a.garantie):"bis "+de(a.garantie)+(t<=30?" (in "+t+" Tagen)":""))+ue+'</b></div>'}
function zeichneAutos(){
  const namen=D&&D.cars?D.cars.map(c=>c.anzeige||c.n):[],stamm=lies("mietixAutos",{}),vorg=lies("mietixVorgaenge",[]),zust=lies("mietixZustand",[]),h=heute();
  Object.keys(stamm).forEach(n=>{if(namen.indexOf(n)<0)namen.push(n)});
  $("autos").innerHTML=namen.map(n=>{const a=stamm[n]||{};
    const kms=vorg.filter(v=>v.auto===n).map(v=>zahl((v.rueck||{}).km)||zahl((v.ueb||{}).km)||zahl(v.km)||0);
    const kmStand=Math.max(zahl(a.km)||0,...kms);
    const jetzt=vorg.find(v=>v.auto===n&&v.status!=="zurück"&&v.vonD<=h&&v.bisD>=h);
    const naechste=vorg.filter(v=>v.auto===n&&v.status!=="zurück"&&v.vonD>h).sort((x,y)=>x.vonD.localeCompare(y.vonD))[0];
    const punkte=zust.filter(z=>z.auto===n&&!z.erledigt),erl=zust.filter(z=>z.auto===n&&z.erledigt);
    return'<div class="karte auto" data-auto="'+n+'"><h3>'+n+'</h3><div class="kz">'+(a.kz||"")+(a.fin?"  |  FIN "+a.fin:"")+'</div>'+
      '<div class="zeile"><span>Kilometerstand</span><b>'+(kmStand?km(kmStand):"<span class=grau>unbekannt</span>")+'</b></div>'+
      '<div class="zeile"><span>Gerade</span><b>'+(jetzt?'<span class="rot">unterwegs: '+jetzt.name+' bis '+de(jetzt.bisD)+'</span>':'<span class="gruen">frei</span>')+'</b></div>'+
      '<div class="zeile"><span>Nächste Miete</span><b>'+(naechste?naechste.name+", "+de(naechste.vonD):'<span class="grau">keine</span>')+'</b></div>'+
      termin("TÜV",a.tuev)+termin("Service",a.service)+termin("Reifen",a.reifen)+
      // Garantie (30.10.2026, Baran): bis wann und über wen, aus dem Reiter Autos der Excel (garantie, garantieUeber)
      garantieZeile(a)+
      '<div class="zeile fs" data-fs="'+n+'"><span>Fahrzeugschein<i class="fsStand"></i></span><span class="fsKn"><button type="button" class="fsAuf">Öffnen</button><label class="fsHoch">Hochladen<input type="file" accept="image/*,application/pdf" hidden></label></span></div>'+
      (a.notiz?'<div class="zeile"><span class="grau" style="font-size:12px">'+a.notiz+'</span></div>':'')+
      '<h2 style="margin-top:12px">Zustand, offene Punkte</h2>'+(punkte.length?punkte.map(p=>'<div class="punkt" data-z="'+p.id+'" data-seit="'+de(p.datum)+'"><span class="box"></span><span><span class="t">'+p.text+'</span><i>seit '+de(p.datum)+', antippen = erledigt</i></span></div>').join(""):'<div class="leer">Nichts offen.</div>')+
      (erl.length?'<div class="erl"><a href="#">'+erl.length+(erl.length===1?' erledigter Punkt':' erledigte Punkte')+', zeigen</a><div class="versteckt">'+erl.map(p=>'<div class="punkt alt" data-auf="'+p.id+'"><span class="box an"></span><span><span class="t">'+p.text+'</span><i>erledigt '+de(p.erledigtAm||p.datum)+', antippen = wiederherstellen</i></span></div>').join("")+'</div></div>':'')+
      '<div class="neu"><input placeholder="Neuer Punkt, z. B. Kratzer" data-neu="'+n+'"><button data-neuz="'+n+'">+</button></div></div>'}).join("")||'<div class="leer">Preisdatei wird geladen …</div>';
  // Sicherheitsnetz: erst antippen = Rückfrage, nochmal antippen = erledigt. Erledigte lassen sich wieder öffnen.
  [...$("autos").querySelectorAll(".punkt[data-z]")].forEach(e=>e.onclick=()=>{
    if(!e.classList.contains("frag")){e.classList.add("frag");e.querySelector("i").textContent="Wirklich erledigt? Nochmal antippen = ja";
      setTimeout(()=>{if(e.isConnected){e.classList.remove("frag");e.querySelector("i").textContent="seit "+e.dataset.seit+", antippen = erledigt"}},4000);return}
    const l=lies("mietixZustand",[]),z=l.find(x=>x.id===e.dataset.z);if(z){z.erledigt=true;z.erledigtAm=heute();schreib("mietixZustand",l);meldung("Erledigt");zeichneAutos()}});
  [...$("autos").querySelectorAll(".erl a")].forEach(a=>a.onclick=ev=>{ev.preventDefault();a.nextElementSibling.classList.toggle("versteckt")});
  [...$("autos").querySelectorAll(".punkt[data-auf]")].forEach(e=>e.onclick=()=>{const l=lies("mietixZustand",[]),z=l.find(x=>x.id===e.dataset.auf);
    if(z){z.erledigt=false;delete z.erledigtAm;schreib("mietixZustand",l);meldung("Wieder offen");zeichneAutos()}});
  [...$("autos").querySelectorAll("button[data-neuz]")].forEach(b=>b.onclick=()=>{const inp=$("autos").querySelector('input[data-neu="'+b.dataset.neuz+'"]'),t=inp.value.trim();if(!t)return;
    const l=lies("mietixZustand",[]);l.push({id:String(Date.now())+Math.random().toString(36).slice(2,6),auto:b.dataset.neuz,text:t,erledigt:false,datum:heute()});schreib("mietixZustand",l);zeichneAutos()});
  [...$("autos").querySelectorAll("input[data-neu]")].forEach(i=>i.addEventListener("keydown",e=>{if(e.key==="Enter")$("autos").querySelector('button[data-neuz="'+i.dataset.neu+'"]').click()}))}

/* ---------- Wer fuhr wann: Mieter zum Datum, Angaben für die Fahrerbenennung kopieren ---------- */
function wfFuellen(){const namen=D&&D.cars?D.cars.map(c=>c.anzeige||c.n):Object.keys(lies("mietixAutos",{}));const alt=$("wfAuto").value;
  $("wfAuto").innerHTML='<option value="">Auto</option>'+namen.map(n=>'<option>'+n+'</option>').join("");if(alt)$("wfAuto").value=alt}
function wfSuchen(){const d=$("wfDatum").value,a=$("wfAuto").value;if(!d||!a){$("wfErgebnis").textContent="Datum und Auto wählen.";return}
  const t=lies("mietixVorgaenge",[]).filter(v=>v.auto===a&&v.vonD&&v.bisD&&v.vonD<=d&&v.bisD>=d);
  if(!t.length){$("wfErgebnis").innerHTML="Kein Mietvertrag für "+a+" am "+de(d)+". Dann war das Auto bei uns oder in der Werkstatt.";return}
  $("wfErgebnis").innerHTML=t.map(v=>{const text="Fahrer am "+de(d)+", "+a+(v.kz?" ("+v.kz+")":"")+":\n"+v.name+"\n"+(v.anschrift||"")+"\ngeboren am "+de(v.geb)+(v.gebort?" in "+v.gebort:"")+"\nTelefon "+(v.telefon||"")+(v.email?"\nE-Mail "+v.email:"")+"\nMietvertrag Nr. "+v.nr+", "+de(v.vonD)+" bis "+de(v.bisD);
    return'<div style="margin-top:6px"><b>'+v.name+'</b><br><span class="grau" style="font-size:13px">'+(v.anschrift||"")+'<br>geb. '+de(v.geb)+(v.gebort?" in "+v.gebort:"")+', Tel. '+(v.telefon||"")+'<br>Mietvertrag '+v.nr+', '+de(v.vonD)+' bis '+de(v.bisD)+'</span>'+
      '<div class="chips"><div class="chip wfKopie" data-t="'+encodeURIComponent(text)+'">Angaben kopieren (für die Fahrerbenennung)</div>'+(v.telefon?'<a class="chip" style="text-decoration:none;color:inherit" target="_blank" href="https://wa.me/'+String(v.telefon).replace(/\D/g,"").replace(/^0/,"49")+'">WhatsApp</a>':'')+'</div></div>'}).join("");
  [...$("wfErgebnis").querySelectorAll(".wfKopie")].forEach(c=>c.onclick=()=>{try{navigator.clipboard.writeText(decodeURIComponent(c.dataset.t))}catch(e){}meldung("Kopiert. In das Formular der Behörde einfügen.")})}
$("wfDatum").addEventListener("change",wfSuchen);$("wfAuto").addEventListener("change",wfSuchen);

/* ---------- Aufgaben ---------- */
// TÜV, Service, Reifen: 30 Tage vorher als Termin, von selbst (aus dem Reiter Autos der Excel)
function termineListe(){const st=lies("mietixAutos",{}),l=[];
  Object.keys(st).forEach(n=>[["tuev","TÜV"],["service","Service"],["reifen","Reifen"],["garantie","Garantie"]].forEach(([k,t])=>{const d=st[n][k];if(!d)return;const tage=tageBis(d);if(tage<=30)l.push({auto:n,was:t,datum:d,tage})}));
  return l.sort((a,b)=>a.tage-b.tage)}
function zeichneTermine(){const l=termineListe();$("termineKarte").classList.toggle("versteckt",!l.length);
  $("termine").innerHTML=l.map(x=>'<div class="punkt'+(x.tage<=7?" heute":"")+'" style="cursor:default"><span><span class="t">'+x.was+" "+x.auto+'</span><i>'+(x.tage<0?"überfällig seit "+de(x.datum):x.tage===0?"heute":"in "+x.tage+" Tagen, "+de(x.datum))+'</i></span></div>').join("")}
function zeichneAufgaben(){const h=heute();zeichneTermine();
  const l=lies("mietixAufgaben",[]).filter(a=>!a.erledigt&&!a._weg&&a.aufgabe).sort((x,y)=>(x.bis||"9")+(x.seit||"")<(y.bis||"9")+(y.seit||"")?-1:1);
  $("aufgaben").innerHTML=l.length?l.map(a=>{const t=tageBis(a.bis);const wann=a.bis?(t<0?"überfällig seit "+de(a.bis):t===0?"heute":t===1?"morgen":"bis "+de(a.bis)):"";
    return'<div class="punkt'+(t!==null&&t<=0?" heute":"")+'" data-a="'+a.id+'"><span class="box"></span><span><span class="t">'+a.aufgabe+'</span><i>'+[wann,a.status&&a.status!=="Offen"?a.status:"",a.betrag?a.betrag.toLocaleString("de-DE")+" €":"",a.tun].filter(Boolean).join("  |  ")+'</i></span></div>'}).join(""):'<div class="leer">Nichts offen. Die Aufgaben aus der Excel kommen automatisch hierher.</div>';

  const stand=laeuft?"gleicht ab …":fehler?"nicht abgeglichen: "+fehler:zuletzt?"abgeglichen um "+String(zuletzt.getHours()).padStart(2,"0")+":"+String(zuletzt.getMinutes()).padStart(2,"0"):"wartet auf Internet";

/* Einheit fest im Zahlenfeld (31.10.2026) */
(function(){if(window.mxEinheit)return;
  const REGELN=[[/€|&euro;|\beur\b|betrag|preis|kaution|einbehalt|aufpreis|kosten|wert\b|selbstbeteiligung/i,"€"],
    [/rabatt|prozent/i,"%"],[/liter/i,"Liter"],[/profiltiefe|\bmm\b/i,"mm"],[/stück|schlüssel/i,"Stück"],[/^\s*alter\b/i,"Jahre"],
    [/kilometer|\bkm\b|freikm/i,"km"]];
  const AUS=new Set(["nr"]);   // Mietvertrag-Nummer bleibt ohne Einheit
  function beschriftung(f){let l=f.id?document.querySelector('label[for="'+f.id+'"]'):null;
    if(!l){let e=f.previousElementSibling;while(e&&!l){if(e.tagName==="LABEL")l=e;e=e.previousElementSibling}}
    if(!l&&f.parentElement){const ls=f.parentElement.querySelectorAll("label");if(ls.length===1)l=ls[0]}
    return l}
  function einheit(f){if(f.dataset.einheit!==undefined)return f.dataset.einheit;
    if(/^(VL|VR|HL|HR)$/.test(f.placeholder||""))return"mm";   // Profiltiefe je Rad, eine Beschriftung für vier Felder
    // Einheit steht schon direkt am Feld (€-Kästchen davor, "km" dahinter): nichts doppelt
    for(const n of [f.previousElementSibling,f.nextElementSibling])if(n&&n.tagName!=="LABEL"&&n.tagName!=="INPUT"&&/^\s*(€|km|%|prozent|liter|mm)/i.test(n.textContent||""))return"";
    const l=beschriftung(f),t=((l?l.textContent:"")+" "+(f.placeholder||"")).trim();
    for(const [re,e] of REGELN)if(re.test(t))return e;return""}
  function bild(e){const w=Math.round(e.length*10.5+4),
      svg='<svg xmlns="http://www.w3.org/2000/svg" width="'+w+'" height="22"><text x="'+w+'" y="16" text-anchor="end" font-family="-apple-system,Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#8A8A8E">'+e+'</text></svg>';
    return{url:'url("data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg)+'")',w}}
  function setzen(f){if(f.dataset.mxE||AUS.has(f.id)||f.type==="date"||f.type==="time")return;
    const e=einheit(f);f.dataset.mxE="1";if(!e)return;const b=bild(e),pr=parseFloat(getComputedStyle(f).paddingRight)||12;
    f.style.backgroundImage=b.url;f.style.backgroundRepeat="no-repeat";f.style.backgroundPosition="right "+Math.max(12,pr)+"px center";
    f.style.paddingRight=(Math.max(12,pr)+b.w+8)+"px";
    // dieselbe Einheit am Ende der Beschriftung ist jetzt doppelt
    const l=beschriftung(f),t=l&&l.lastChild;if(t&&t.nodeType===3){const ende={"€":/\s*€\s*$/,"km":/\s*\(km\)\s*$/,"mm":/\s+in mm\s*$/,"Stück":/\s*\(Stück\)\s*$/}[e];
      if(ende&&ende.test(t.nodeValue)&&t.nodeValue.replace(ende,"").trim())t.nodeValue=t.nodeValue.replace(ende,"")}}
  function alle(w){(w||document).querySelectorAll('input[inputmode="decimal"],input[inputmode="numeric"],input[type="number"]').forEach(setzen)}
  window.mxEinheit=alle;alle();
  new MutationObserver(ms=>{for(const m of ms)for(const n of m.addedNodes)if(n.nodeType===1){if(n.matches&&n.matches("input"))setzen(n);else if(n.querySelectorAll)alle(n)}})
    .observe(document.body,{childList:true,subtree:true})})();
